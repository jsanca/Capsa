services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: capsa
      POSTGRES_USER: ${CAPSA_DB_USER}
      POSTGRES_PASSWORD: ${CAPSA_DB_PASSWORD}
    volumes:
      - capsa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CAPSA_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  capsa:
    image: capsa:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CAPSA_DB_URL: jdbc:postgresql://postgres:5432/capsa
      CAPSA_DB_USER: ${CAPSA_DB_USER}
      CAPSA_DB_PASSWORD: ${CAPSA_DB_PASSWORD}
      CAPSA_OIDC_AUTH_SERVER_URL: ${CAPSA_OIDC_AUTH_SERVER_URL}
      CAPSA_OIDC_CLIENT_ID: ${CAPSA_OIDC_CLIENT_ID:-capsa}
      # One-time bootstrap secret. Required on first deployment; inert after bootstrap.
      # Set as a secret in Coolify — never hardcode.
      CAPSA_BOOTSTRAP_TOKEN: ${CAPSA_BOOTSTRAP_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  capsa-pgdata:
