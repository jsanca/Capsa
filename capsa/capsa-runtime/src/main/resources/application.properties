quarkus.application.name=capsa

# Force-index capability JARs for CDI bean and entity discovery
quarkus.index-dependency.users.group-id=com.capsa
quarkus.index-dependency.users.artifact-id=capsa-users
quarkus.index-dependency.lists.group-id=com.capsa
quarkus.index-dependency.lists.artifact-id=capsa-lists
quarkus.index-dependency.items.group-id=com.capsa
quarkus.index-dependency.items.artifact-id=capsa-items
quarkus.index-dependency.classification.group-id=com.capsa
quarkus.index-dependency.classification.artifact-id=capsa-classification
quarkus.index-dependency.capture.group-id=com.capsa
quarkus.index-dependency.capture.artifact-id=capsa-capture

# Flyway - run migrations on startup
quarkus.flyway.migrate-at-start=true

# Hibernate - schema managed by Flyway; do not auto-generate DDL
quarkus.hibernate-orm.database.generation=none

# OIDC - production server configured via environment variables
quarkus.oidc.auth-server-url=${CAPSA_OIDC_AUTH_SERVER_URL:}
quarkus.oidc.client-id=${CAPSA_OIDC_CLIENT_ID:capsa}

# Dev and test modes disable OIDC; use @TestSecurity in tests
%dev.quarkus.oidc.enabled=false
%test.quarkus.oidc.enabled=false
